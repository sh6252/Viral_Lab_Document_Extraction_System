[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-lab-document-extraction-system"
version = "0.1.0"
description = "Evaluation and backend foundation for the Central Virology Laboratory document extraction system."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "SQLAlchemy>=2.0.55,<2.1",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20,<2",
    "fastapi>=0.115,<0.116",
    "google-genai>=1.75,<2",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<0.1",
    "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
    "PyMuPDF>=1.28.2,<1.29",
    "httpx>=0.27,<0.29",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = [
    "schemas/*.json",
    "fixtures/dev/.gitkeep",
    "fixtures/dev/smoke/*",
    "fixtures/holdout/.gitkeep",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = ["postgresql: requires an explicitly authorized disposable PostgreSQL test database"]
