[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-lab-document-extraction-system"
version = "0.1.0"
description = "Evaluation and backend foundation for the Central Virology Laboratory document extraction system."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<0.116",
    "google-genai>=1.75,<2",
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["backend*", "evaluation*"]

[tool.setuptools.package-data]
evaluation = [
    "schemas/*.json",
    "fixtures/dev/.gitkeep",
    "fixtures/holdout/.gitkeep",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
