# Single origin: third-party cookies are not needed. No database is created here.
services:
  - type: web
    name: viral-lab-judges-demo
    runtime: python
    plan: free
    region: frankfurt
    branch: release/submission-2026-10-22
    autoDeployTrigger: "off"
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && python -m pip install .
    startCommand: python -m uvicorn backend.cloud_app:create_cloud_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers
    healthCheckPath: /api/v1/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: NODE_VERSION
        value: 24.14.0
      - key: APP_DEPLOYMENT
        value: cloud
      - key: DEMO_DATA_POLICY
        value: synthetic-only
      - key: VITE_PUBLIC_DEMO
        value: "true"
      - key: VITE_API_BASE_URL
        value: ""
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: DEMO_DATABASE_NAME
        value: viral_lab_submission_synthetic
      - key: REVIEW_DATABASE_DSN
        sync: false
      - key: DEMO_PASSWORD_HASH
        sync: false
      - key: AI_OUTBOUND_ENABLED
        value: "false"
      - key: ALLOW_EXTERNAL_PHI
        value: "false"
      - key: APPROVED_AI_PROVIDERS
        value: ""
      - key: DEFAULT_EXTRACTION_ADAPTER
        value: local_ocr
